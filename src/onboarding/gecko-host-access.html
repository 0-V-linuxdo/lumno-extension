<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumno · 允许访问网站</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0d10;
        --fg: #f4f4f5;
        --muted: #9a9aa8;
        --primary: #7c8cff;
        --primary-fg: #0b0c12;
        --surface: #16171c;
        --border: #2a2c36;
        --ok: #5ee0a8;
        --warn: #f2c14e;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "Noto Sans SC", sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.25;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      ol {
        color: var(--fg);
        line-height: 1.7;
        padding-left: 1.2rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 700;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      .status {
        min-height: 1.5rem;
        margin-top: 1rem;
        font-weight: 600;
      }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .card {
        margin-top: 1.5rem;
        padding: 1.25rem 1.4rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <main>
      <p style="color:var(--primary);font-weight:600;">Firefox / Zen</p>
      <h1>Lumno 需要访问当前网页</h1>
      <p>
        Firefox 临时载入附加组件时，<strong>不会弹出网站权限</strong>。
        没有这项权限，内容脚本进不了 https 页面，快捷键看起来就像完全没反应。
      </p>
      <p>
        点下面的按钮授权。授权后命令栏会立刻装进已经打开的 https 页面，不必刷新，直接按 Alt+K / Alt+Q。
      </p>
      <p>
        <button type="button" id="grant">允许访问所有网站</button>
      </p>
      <p class="status" id="status"></p>
      <div class="card">
        <strong>如果按钮没有弹出授权框</strong>
        <ol>
          <li>打开 <code>about:addons</code></li>
          <li>找到 Lumno → 权限</li>
          <li>打开「访问您在所有网站的数据」</li>
          <li>回到 https 页面，不必刷新，直接按 Alt+K</li>
        </ol>
      </div>
    </main>
    <script src="gecko-host-access.js"></script>
  </body>
</html>
