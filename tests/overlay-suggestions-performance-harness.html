<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumno Overlay Suggestions Performance Harness</title>
  <link rel="stylesheet" href="../src/overlay/suggestions-view.css">
  <style>
    body { margin: 24px; font-family: sans-serif; background: #f5f7fb; }
    button { margin-bottom: 16px; padding: 8px 12px; }
    #metrics { margin-bottom: 12px; white-space: pre-wrap; }
    #_x_extension_overlay_2024_unique_ { width: 680px; color: #111827; }
    .x-ov-suggestions-container {
      height: 320px;
      overflow: auto;
      padding: 6px;
      border-radius: 18px;
      background: #fff;
    }
  </style>
</head>
<body>
  <button id="render-tabs" type="button">渲染 1000 个标签页</button>
  <div id="metrics" role="status">等待测试</div>
  <div id="_x_extension_overlay_2024_unique_">
    <div class="x-ov-suggestions-container"></div>
  </div>
  <script src="../src/shared/suggestion-action-model.js"></script>
  <script src="../src/react/overlay-islands.js"></script>
  <script>
    const container = document.querySelector('.x-ov-suggestions-container');
    const metrics = document.querySelector('#metrics');
    const items = [];
    const tabs = Array.from({ length: 1000 }, (_, index) => ({
      id: index + 1,
      title: `Performance tab ${index + 1}`,
      url: `https://example.com/page/${index + 1}`
    }));
    const longTasks = [];
    if (window.PerformanceObserver &&
        PerformanceObserver.supportedEntryTypes.includes('longtask')) {
      new PerformanceObserver((list) => {
        list.getEntries().forEach((entry) => longTasks.push(entry.duration));
      }).observe({ type: 'longtask', buffered: true });
    }
    const view = window.LumnoOverlaySuggestionsView.createSuggestionsView({
      surface: 'overlay',
      document,
      container,
      items,
      actionModel: window.LumnoSuggestionActionModel,
      openTabSuggestionLimit: 1000,
      openTabInitialRenderLimit: 24,
      openTabRenderBatchSize: 32,
      getHostFromUrl: (url) => new URL(url).hostname,
      getThemeForSuggestion: () => new Promise(() => {}),
      attachFaviconWithFallbacks: () => {},
      setSuggestionsVisible: () => {}
    });

    document.querySelector('#render-tabs').addEventListener('click', () => {
      longTasks.length = 0;
      const startedAt = performance.now();
      view.renderTabs(tabs);
      const initialDuration = performance.now() - startedAt;
      const initialRows = items.length;
      const poll = () => {
        if (items.length < tabs.length) {
          requestAnimationFrame(poll);
          return;
        }
        requestAnimationFrame(() => {
          const result = {
            status: 'complete',
            initialRows,
            initialDurationMs: Number(initialDuration.toFixed(2)),
            totalDurationMs: Number((performance.now() - startedAt).toFixed(2)),
            longestTaskMs: Number(Math.max(0, ...longTasks).toFixed(2)),
            renderedRows: items.length
          };
          metrics.textContent = JSON.stringify(result);
          metrics.dataset.result = JSON.stringify(result);
          metrics.dataset.complete = 'true';
        });
      };
      poll();
    });
  </script>
</body>
</html>
