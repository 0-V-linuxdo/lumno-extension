name: Monitor Supabase Production

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a synthetic alert through Feishu and backup email
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monitor-supabase-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore incident state
        uses: actions/cache/restore@v5
        with:
          path: .monitor-state/supabase.json
          key: supabase-monitor-restore-${{ github.run_id }}
          restore-keys: |
            supabase-monitor-state-

      - name: Check production and notify on transitions
        id: monitor
        env:
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MONITOR_TOKEN }}
          LUMNO_MONITOR_KEY: ${{ secrets.LUMNO_MONITOR_KEY }}
          FEISHU_ALERT_WEBHOOK_URL: ${{ secrets.FEISHU_ALERT_WEBHOOK_URL }}
          FEISHU_SMTP_PASSWORD: ${{ secrets.FEISHU_SMTP_PASSWORD }}
          MONITOR_TEST_NOTIFICATION: ${{ inputs.test_notification && '1' || '' }}
        run: node scripts/monitor-supabase-production.mjs

      - name: Save incident state
        if: always() && steps.monitor.outputs.state_hash != ''
        uses: actions/cache/save@v5
        with:
          path: .monitor-state/supabase.json
          key: supabase-monitor-state-${{ steps.monitor.outputs.state_hash }}
