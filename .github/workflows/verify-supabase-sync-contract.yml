name: Verify Supabase Sync Contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/shared/cloud-sync-schema.js"
      - "supabase/migrations/**"
      - "scripts/probe-sync-capabilities.js"

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify anonymous production capabilities
        run: node scripts/probe-sync-capabilities.js
